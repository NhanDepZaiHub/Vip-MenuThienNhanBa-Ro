
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SeSiLockHz Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: 'Segoe UI', sans-serif;
      color: #00ff66;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .menu-container {
      background: #1b1b1b;
      border-radius: 18px;
      padding: 25px;
      width: 320px;
      box-shadow: 0 0 20px rgba(0,255,100,0.3);
      border: 1px solid #00ff66;
    }
    .status {
      font-size: 14px;
      margin-bottom: 15px;
      color: #00ff66;
    }
    .status span {
      font-weight: bold;
    }
    .menu-button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 12px;
      font-size: 15px;
      background-color: #2a2a2a;
      color: #00ff66;
      border: 1px solid #00ff66;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .menu-button:hover {
      background-color: #333;
      box-shadow: 0 0 8px #00ff66;
    }
    label {
      margin-top: 18px;
      display: block;
      padding: 10px;
      background-color: #2e2e2e;
      border: 1px solid #00ff66;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      color: #00ff66;
    }
    input[type="file"] {
      display: none;
    }
    #selectedFile {
      font-size: 12px;
      color: #66ffcc;
      word-break: break-word;
      margin-top: 5px;
    }
    .footer {
      margin-top: 20px;
      font-size: 11px;
      text-align: right;
      color: #66ffcc;
      font-style: italic;
    }
  </style>
</head>
